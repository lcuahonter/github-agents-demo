name: 🔀 PR Description Agent

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main, develop]

permissions:
  pull-requests: write
  contents: read

jobs:
  describe-pr:
    name: Generar descripción del PR
    runs-on: ubuntu-latest
    # No describir PRs ya creados por el agente de docs
    if: "!contains(github.event.pull_request.title, '🤖')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener diff del PR
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          echo "diff_lines=$(wc -l < pr_diff.txt)" >> $GITHUB_OUTPUT

      - name: Generar descripción con Copilot
        id: description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          python .github/scripts/generate_pr_description.py

      - name: Actualizar descripción del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --body-file generated_pr_body.md

      - name: Comentar checklist de documentación
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const checklist = fs.readFileSync('generated_docs_checklist.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: checklist
            });
