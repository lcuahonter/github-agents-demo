name: 📄 Documentation Agent

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Archivo específico a documentar (opcional)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-docs:
    name: Generar documentación automática
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar archivos modificados
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            src/**
            api/**

      - name: Configurar Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar documentación
        if: steps.changed-files.outputs.any_changed == 'true'
        id: generate
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/generate_docs.py

      - name: Actualizar CHANGELOG
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          python .github/scripts/update_changelog.py

      - name: Crear Pull Request con docs actualizadas
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs/auto-update-${{ github.run_number }}
          base: main
          commit-message: "docs: actualización automática generada por agente"
          title: "docs: actualización automática [${{ github.run_number }}] 🤖"
          body: |
            ## Documentación actualizada automáticamente

            **Disparado por:** push de `${{ github.actor }}` al commit `${{ github.sha }}`
            **Archivos de código modificados:**
            ```
            ${{ steps.changed-files.outputs.all_changed_files }}
            ```

            ### Qué cambió en la documentación
            ${{ steps.generate.outputs.summary }}

            ### Checklist
            - [x] `docs/api-reference.md` actualizado
            - [x] `docs/CHANGELOG.md` actualizado
            - [ ] Revisión humana completada

            ---
            _Generado automáticamente por el Documentation Agent · No editar manualmente_
          labels: |
            documentation
            automated
          assignees: ${{ github.actor }}
          reviewers: ${{ github.actor }}
          delete-branch: true
